name: Deploy

on:
  push:
    branches:
      ['main','master']

  workflow_dispatch:

  # 设置 GITHUB_TOKEN 的权限，以允许部署到 GitHub Pages。
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发的部署
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # 单次部署的工作描述
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm' # 这里指定了使用 pnpm 缓存

      # 👇 新增：安装 pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # 👇 修改：使用 pnpm 安装依赖（会自动触发 ci 模式）
      - name: Install dependencies
        run: pnpm install

      # 👇 修改：使用 pnpm 执行构建
      - name: Build
        run: pnpm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v1